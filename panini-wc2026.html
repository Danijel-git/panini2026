<html lang="sr">

<meta charset="UTF-8">

<title>Panini WC 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b1120; color: #dde; font-family: Arial, sans-serif; font-size: 14px; }

/* HEADER */
#hdr {
  background: #111c35;
  border-bottom: 2px solid #1f3060;
  padding: 12px 14px;
  position: sticky; top: 0; z-index: 30;
}
#hdr-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
#hdr h1 { font-size: 16px; color: #fff; font-weight: 900; }
#hdr .sub { font-size: 11px; color: #7a8bb0; margin-top: 2px; }
#score { font-size: 22px; font-weight: 900; color: #4ade80; line-height: 1; }
#score span { font-size: 11px; color: #7a8bb0; display: block; }
#prog { background: #1a2540; border-radius: 4px; height: 6px; overflow: hidden; }
#progfill { height: 100%; background: linear-gradient(90deg,#16a34a,#4ade80); width: 0%; transition: width .3s; }
#pct { font-size: 10px; color: #5a6b8a; margin-top: 3px; }
#cfg-btn { background: #1e2e4a; border: 1px solid #2a3a5c; border-radius: 6px; padding: 6px 9px; cursor: pointer; color: #ccc; font-size: 16px; }

/* SETTINGS */
#cfg {
  background: #0d1929; border-bottom: 1px solid #1e2e4a;
  padding: 12px 14px; display: none;
}
#cfg h3 { font-size: 12px; color: #aaa; letter-spacing: 1px; margin-bottom: 6px; }
#cfg .hint { font-size: 11px; color: #4a5a78; margin-bottom: 8px; line-height: 1.5; }
#cfg input {
  width: 100%; background: #1a2540; border: 1px solid #2a3a5c; border-radius: 5px;
  padding: 7px 10px; color: #dde; font-size: 13px; outline: none; margin-bottom: 6px;
}
.brow { display: flex; gap: 6px; }
.bload { flex:1; background:#1e3a5f; border:none; border-radius:5px; padding:8px; color:#7dd3fc; cursor:pointer; font-size:12px; font-weight:700; }
.bsave { flex:1; background:#14532d; border:none; border-radius:5px; padding:8px; color:#4ade80; cursor:pointer; font-size:12px; font-weight:700; }
#smsg { display:none; margin-top:6px; padding:6px 10px; border-radius:5px; font-size:12px; }
#gistshow { margin-top:6px; font-size:10px; color:#4a5a78; word-break:break-all; }

/* FILTERS */
#filters {
  background: #0e1828; border-bottom: 1px solid #1a2540;
  padding: 10px 14px; position: sticky; top: 88px; z-index: 20;
}
#filters input, #filters select {
  width: 100%; background: #1a2540; border: 1px solid #2a3a5c; border-radius: 6px;
  padding: 7px 10px; color: #dde; font-size: 13px; outline: none; margin-bottom: 6px;
  appearance: none;
}
.fbts { display: flex; gap: 5px; }
.fbt {
  flex:1; background:#1a2540; border:none; border-radius:5px;
  padding:6px 2px; color:#6a7a9a; cursor:pointer; font-size:11px;
}
.fbt.on { background:#22c55e; color:#000; font-weight:800; }
#rcount { font-size: 10px; color: #4a5a78; margin-top: 5px; }

/* LIST */
#list { padding-bottom: 40px; }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; border-bottom: 1px solid #0f1a2c; cursor: pointer;
}
.row.got { background: #0a1f14; }
.row:active { background: #1a2540; }

.anum { min-width: 32px; text-align: center; }
.anum .n { font-size: 15px; font-weight: 900; color: #2a3a5a; line-height: 1; }
.anum .n.gc { color: #4ade80; }
.anum .lbl { font-size: 9px; color: #2a3a5a; }

.badge {
  min-width: 50px; text-align: center; border-radius: 5px;
  padding: 3px 4px; background: #1a2540;
}
.badge.foil { background: linear-gradient(135deg,#fbbf24,#f59e0b); }
.badge.gc { background: #1a3a28; }
.badge .code { font-size: 11px; font-weight: 900; color: #5a6a8a; letter-spacing: 0.5px; }
.badge.foil .code { color: #000; }
.badge.gc .code { color: #4ade80; }
.badge .fl { font-size: 8px; color: #78350f; font-weight: 700; }

.info { flex: 1; min-width: 0; }
.info .nm { font-size: 13px; color: #b0bcd0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .nm.gc { color: #d0f0dc; font-weight: 700; }
.info .tm { font-size: 10px; color: #4a5a78; }

.chk {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid #2a3a5c; background: transparent;
  display: flex; align-items: center; justify-content: center;
}
.chk.on { border-color: #22c55e; background: #22c55e; }
.chk.on::after { content: '✓'; color: #000; font-size: 13px; font-weight: 900; }

#foot {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #080e1a; border-top: 1px solid #1a2540;
  padding: 7px 14px; text-align: center;
  font-size: 10px; color: #4a5a78;
}
</style>
</head>

// ─── STATE ────────────────────────────────────────────────────────────────
var collected = {};
var showMode = "sve";

function updateHeader() {
  var cnt = Object.keys(collected).length;
  document.getElementById('score').innerHTML = cnt + ' <span>/ ' + TOTAL + '</span>';
  var pct = Math.round(cnt / TOTAL * 100);
  document.getElementById('progfill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '% kompletan album';
}

function render() {
  var q = document.getElementById('srch').value.toLowerCase();
  var team = document.getElementById('tsel').value;
  var list = [];
  for (var i = 0; i < STICKERS.length; i++) {
    var s = STICKERS[i];
    if (team !== 'Sve' && s.team !== team) continue;
    if (showMode === 'imam' && !collected[s.n]) continue;
    if (showMode === 'nemam' && collected[s.n]) continue;
    if (q && s.name.toLowerCase().indexOf(q) < 0 && s.code.toLowerCase().indexOf(q) < 0 && String(s.n).indexOf(q) < 0) continue;
    list.push(s);
  }
  document.getElementById('rcount').textContent = 'Prikazano: ' + list.length + ' sličica';
  var html = '';
  for (var j = 0; j < list.length; j++) {
    var s = list[j];
    var c = !!collected[s.n];
    var badgeCls = 'badge' + (s.foil ? ' foil' : '') + (c && !s.foil ? ' gc' : '');
    html += '<div class="row' + (c ? ' got' : '') + '" onclick="toggle(' + s.n + ')">'
      + '<div class="anum"><div class="n' + (c ? ' gc' : '') + '">' + s.n + '</div><div class="lbl">APP</div></div>'
      + '<div class="' + badgeCls + '"><div class="code">' + s.code + '</div>' + (s.foil ? '<div class="fl">FOIL</div>' : '') + '</div>'
      + '<div class="info"><div class="nm' + (c ? ' gc' : '') + '">' + s.name + '</div><div class="tm">' + s.team + '</div></div>'
      + '<div class="chk' + (c ? ' on' : '') + '"></div>'
      + '</div>';
  }
  document.getElementById('list').innerHTML = html;
}

function toggle(n) {
  if (collected[n]) delete collected[n]; else collected[n] = 1;
  updateHeader();
  render();
}

function setMode(m, btn) {
  showMode = m;
  var btns = document.querySelectorAll('.fbt');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('on');
  btn.classList.add('on');
  render();
}

function toggleCfg() {
  var el = document.getElementById('cfg');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
  updateStickyTop();
}

function updateStickyTop() {
  var hh = document.getElementById('hdr').offsetHeight;
  var ch = 0;
  var cfg = document.getElementById('cfg');
  if (cfg.style.display === 'block') ch = cfg.offsetHeight;
  document.getElementById('filters').style.top = (hh + ch) + 'px';
}

function showMsg(txt, ok) {
  var el = document.getElementById('smsg');
  el.style.display = 'block';
  el.style.background = ok ? '#14532d' : '#7f1d1d';
  el.style.color = ok ? '#4ade80' : '#fca5a5';
  el.textContent = txt;
  setTimeout(function() { el.style.display = 'none'; }, 3500);
}

var GFILE = 'panini_wc2026_tracker.json';

function loadGist() {
  var token = document.getElementById('gh-tok').value.trim();
  var gid = document.getElementById('gh-gid').value.trim();
  if (!token || !gid) { showMsg('Unesi token i Gist ID', false); return; }
  fetch('https://api.github.com/gists/' + gid, {
    headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json' }
  }).then(function(r) {
    if (!r.ok) throw new Error('GitHub greška ' + r.status);
    return r.json();
  }).then(function(data) {
    var raw = data.files && data.files[GFILE] && data.files[GFILE].content;
    if (!raw) throw new Error('Fajl nije pronađen u Gist-u');
    var parsed = JSON.parse(raw);
    collected = {};
    var arr = parsed.collected || [];
    for (var i = 0; i < arr.length; i++) collected[arr[i]] = 1;
    updateHeader(); render();
    showMsg('Ucitano ' + arr.length + ' slicica', true);
  }).catch(function(e) { showMsg(e.message, false); });
}

function saveGist() {
  var token = document.getElementById('gh-tok').value.trim();
  var gid = document.getElementById('gh-gid').value.trim();
  if (!token) { showMsg('Unesi GitHub token', false); return; }
  var arr = Object.keys(collected).map(Number);
  var payload = { collected: arr, savedAt: new Date().toISOString() };
  var body = {
    description: 'Panini WC 2026 tracker',
    public: false,
    files: {}
  };
  body.files[GFILE] = { content: JSON.stringify(payload, null, 2) };
  fetch(gid ? 'https://api.github.com/gists/' + gid : 'https://api.github.com/gists', {
    method: gid ? 'PATCH' : 'POST',
    headers: { Authorization: 'token ' + token, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
    body: JSON.stringify(body)
  }).then(function(r) {
    if (!r.ok) throw new Error('Greska ' + r.status);
    return r.json();
  }).then(function(data) {
    document.getElementById('gh-gid').value = data.id;
    document.getElementById('gistshow').textContent = 'Gist ID: ' + data.id;
    showMsg('Sacuvano! ' + arr.length + ' slicica', true);
  }).catch(function(e) { showMsg(e.message, false); });
}

// INIT
window.onload = function() {
  var sel = document.getElementById('tsel');
  for (var i = 0; i < TEAMS.length; i++) {
    var o = document.createElement('option');
    o.value = TEAMS[i]; o.textContent = TEAMS[i];
    sel.appendChild(o);
  }
  updateHeader();
  render();
};
